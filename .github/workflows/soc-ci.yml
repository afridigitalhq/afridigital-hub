name: SOC CI PIPELINE

on:
  push:
    branches: [main]
  pull_request:

jobs:
  soc-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: SOC Runtime Check
        run: node --check src/soc-os/runtime/SOCUnifiedRuntime.js

      - name: SOC Control Plane Check
        run: node --check src/soc-os/control-plane/SOCControlPlane.js || true

      - name: SOC HUD Check
        run: test -d src/soc-os/hud || echo 'HUD optional'

      - name: SOC AI Check
        run: test -d src/soc-os/ai

      - name: Final Gate
        run: |
          echo '━━━━━━━━━━━━━━━━━━━━━━'
          echo '🧠 SOC CI GATE PASSED'
          echo '✔ Runtime OK'
          echo '✔ UI OK'
          echo '✔ AI OK'
          echo '✔ SAFE FOR DEPLOY'
          echo '━━━━━━━━━━━━━━━━━━━━━━'
